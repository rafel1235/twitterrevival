# Disposable, isolated restore verification: no host ports and no live volumes.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local database password required}
      POSTGRES_DB: ${POSTGRES_DB:-radura}
    volumes:
      - restore_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      [
        "mini",
        "-dir=/data",
        "-ip=storage",
        "-master.volumeSizeLimitMB=64",
        "-s3.port.iceberg=0",
        "-s3.port.lance=0",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-radura-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Local S3 secret required}
    volumes:
      - restore_media:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9333/cluster/status",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  verify:
    image: ${RADURA_RESTORE_API_IMAGE:?Existing local API image required}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-radura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-radura}?sslmode=disable
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-radura-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-radura-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Local S3 secret required}
volumes:
  restore_db:
  restore_media:
