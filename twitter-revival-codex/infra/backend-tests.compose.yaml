# Test-only topology. No application credentials, data volumes or published ports.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: radura_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: radura_test
    tmpfs: [/var/lib/postgresql]
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U radura_test -d radura_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      [
        mini,
        -dir=/data,
        -ip=storage,
        -master.volumeSizeLimitMB=64,
        -s3.port.iceberg=0,
        -s3.port.lance=0,
      ]
    environment:
      AWS_ACCESS_KEY_ID: isolated-test
      AWS_SECRET_ACCESS_KEY: isolated-test-secret-never-used-for-application-data
    tmpfs: [/data]
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test:
        [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30
  checks:
    image: golang:1.27.2-alpine
    working_dir: /src
    command:
      - sh
      - -c
      - >-
        test -z "$$(gofmt -l cmd internal migrations)" &&
        go vet ./... &&
        go test -count=1 -json ./... > /results/go-test.jsonl &&
        go build -o /tmp/radura-api ./cmd/server
    environment:
      TEST_DATABASE_URL: postgres://radura_test:isolated-test-password@db:5432/radura_test?sslmode=disable
      TEST_S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: isolated-test
      S3_SECRET_KEY: isolated-test-secret-never-used-for-application-data
      GOCACHE: /cache
      GOPATH: /go
      GOMAXPROCS: "2"
    volumes:
      - ../services/api:/src:ro
      - ../.local/gocache-linux:/cache
      - ../.local/gopath:/go
      - ${BACKEND_TEST_RESULTS:?Use npm run test:backend}:/results
    networks: [backend, tools]
    mem_limit: 1536m
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_healthy }
networks:
  backend: { internal: true }
  tools: {}
