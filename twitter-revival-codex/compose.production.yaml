# Standalone server configuration: do not merge with the development Compose.
name: radura-production
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: radura
      POSTGRES_DB: radura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env.production}
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [backend]
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U radura -d radura"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      [
        mini,
        "-dir=/data",
        "-ip=storage",
        "-master.volumeSizeLimitMB=64",
        "-s3.port.iceberg=0",
        "-s3.port.lance=0",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Configure .env.production}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Configure .env.production}
    volumes: [media_data:/data]
    networks: [backend]
    mem_limit: 768m
    healthcheck:
      test:
        [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    restart: unless-stopped
  migrate:
    image: radura-api:${RELEASE_TAG:?Set a release identifier}
    build: ./services/api
    command: ["-migrate=up"]
    environment:
      DATABASE_URL: postgres://radura:${POSTGRES_PASSWORD}@db:5432/radura?sslmode=disable
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
    restart: "no"
  api:
    image: radura-api:${RELEASE_TAG:?Set a release identifier}
    build: ./services/api
    environment:
      DATABASE_URL: postgres://radura:${POSTGRES_PASSWORD}@db:5432/radura?sslmode=disable
      API_ADDR: 0.0.0.0:8080
      APP_ORIGIN: https://${DOMAIN:?Set the owned domain}
      COOKIE_SECURE: "true"
      SESSION_TTL_HOURS: 168
      BETA_INVITE_ONLY: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?Configure .env.production}
      SMTP_ADDR: ${SMTP_ADDR:?Set a real SMTP relay}
      SMTP_FROM: ${SMTP_FROM:?Set a verified sender}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP credentials}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP credentials}
      SMTP_STARTTLS: "true"
      SMTP_ALLOW_LOCAL_PLAINTEXT: "false"
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: radura-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    networks: [frontend, backend]
    mem_limit: 1536m
    depends_on:
      storage: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /api, "-healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 15s
    logging: *logging
    restart: unless-stopped
  web:
    image: radura-web:${RELEASE_TAG:?Set a release identifier}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_PRODUCT_NAME: Radura
        NEXT_PUBLIC_DEV_MAILBOX_URL: ""
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    networks: [frontend]
    mem_limit: 768m
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *logging
    restart: unless-stopped
  gateway:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact}
      PUBLIC_BETA_ENABLED: ${PUBLIC_BETA_ENABLED:-false}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    mem_limit: 256m
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yaml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=7d",
        "--storage.tsdb.retention.size=1GB",
      ]
    volumes:
      - ./infra/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./infra/monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    networks: [backend]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      api: { condition: service_healthy }
    logging: *logging
    restart: unless-stopped
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
  prometheus_data:
secrets:
  metrics_token:
    file: ./.local/production/metrics-token
