services:
  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      [
        "mini",
        "-dir=/data",
        "-ip=storage",
        "-master.volumeSizeLimitMB=64",
        "-s3.port.iceberg=0",
        "-s3.port.lance=0",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-radura-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Impostare S3_SECRET_KEY in .env}
    volumes:
      - media_data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9333/cluster/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 1000
    restart: unless-stopped
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-radura}
    volumes:
      - postgres_data:/var/lib/postgresql
    # Per sviluppo locale; non esporre PostgreSQL su tutte le interfacce.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./services/api
    command: ["-migrate=up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-radura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-radura}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-radura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-radura}?sslmode=disable
      API_ADDR: 0.0.0.0:8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: ${SMTP_FROM:-Radura <no-reply@radura.test>}
      SMTP_STARTTLS: "false"
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-radura-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-radura-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Impostare S3_SECRET_KEY in .env}
    depends_on:
      storage:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-Radura}
        NEXT_PUBLIC_DEV_MAILBOX_URL: http://localhost:8025
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:
