name: Sprint 4 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twitter-revival-codex
    services:
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: radura
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: radura_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radura -d radura_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://radura:ci-local-only@localhost:5432/radura_test?sslmode=disable
      TEST_DATABASE_URL: postgres://radura:ci-local-only@localhost:5432/radura_test?sslmode=disable
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      E2E_AUTH: "1"
      E2E_MAILPIT: "1"
      SMTP_ADDR: 127.0.0.1:1025
      SMTP_FROM: Radura <no-reply@radura.test>
      SMTP_STARTTLS: "false"
      NEXT_PUBLIC_DEV_MAILBOX_URL: http://localhost:8025
      NEXT_TELEMETRY_DISABLED: "1"
      S3_ENDPOINT: http://127.0.0.1:8333
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      S3_REGION: us-east-1
      S3_BUCKET: radura-media
      S3_ACCESS_KEY: ci-local
      S3_SECRET_KEY: ci-local-only-long-s3-secret-not-for-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: twitter-revival-codex/services/api/go.mod
          cache-dependency-path: twitter-revival-codex/services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: twitter-revival-codex/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: test -z "$(gofmt -l services/api)"
      - name: Start local S3 storage
        run: |
          docker run -d --name radura-storage -p 127.0.0.1:8333:8333 -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" chrislusf/seaweedfs:4.48 mini -dir=/data -ip=127.0.0.1 -master.volumeSizeLimitMB=64 -s3.port.iceberg=0 -s3.port.lance=0
          for i in $(seq 1 60); do curl --silent --output /dev/null http://127.0.0.1:8333 && exit 0; sleep 1; done
          echo 'S3 storage did not start'
          exit 1
      - run: go vet ./... && go test -race -count=1 -v ./... && go build ./cmd/server
        working-directory: twitter-revival-codex/services/api
      - run: npm run lint && npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start API
        working-directory: twitter-revival-codex/services/api
        run: |
          ./server -migrate=up
          ./server > /tmp/radura-api.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat /tmp/radura-api.log
          exit 1
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            twitter-revival-codex/playwright-report
            twitter-revival-codex/test-results
